# docker-compose.yml
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: creditdoc-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage

  langfuse-db:
    image: postgres:16-alpine
    container_name: creditdoc-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - ./data/langfuse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      retries: 5

  langfuse:
    image: langfuse/langfuse:2
    container_name: creditdoc-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-local-dev-secret-32chars
      SALT: change-me-local-dev-salt-16c
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: creditdoc
      LANGFUSE_INIT_PROJECT_ID: creditdoc-ai
      LANGFUSE_INIT_USER_EMAIL: amine@local.dev
      LANGFUSE_INIT_USER_PASSWORD: local-dev-password
      LANGFUSE_INIT_USER_NAME: Amine