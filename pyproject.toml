[project]
name = "creditdoc-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deepeval>=4.2.8",
    "langchain>=1.4.3",
    "langchain-community>=0.3.0,<0.4",
    "langchain-ollama>=1.1.0",
    "langfuse>=2.60,<3",
    "langgraph>=1.2.12",
    "litellm>=1.104.0",
    "markdown>=3.11",
    "pydantic>=2.13.5",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "ragas>=0.2.10",
    "rich>=14.3.4",
    "streamlit>=1.65.0",
    "trafilatura>=2.3.1",
    "unstructured>=0.21.5",
]

[project.scripts]
creditdoc-ai = "creditdoc_ai:main"


[dependency-groups]
dev = [
    "black>=26.10.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
package = false
