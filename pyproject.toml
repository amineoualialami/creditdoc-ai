[project]
name = "creditdoc-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.2.8",
    "langchain>=1.4.3",
    "langchain-community>=0.3.0,<0.4",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.17.0",
    "langgraph>=1.2.12",
    "litellm>=1.104.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "ragas>=0.2.10",
    "rich>=14.3.4",
    "streamlit>=1.65.0",
]

[project.scripts]
creditdoc-ai = "creditdoc_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.10",
]
